<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="../CSS/styles.css" />
</head>

<body>

  <!-- BANNER INICIO -->
  <div class="hero-banner text-center">
    <div class="container">
      <h1 class="display-3 fw-bold">Restaurante Miga de Casa</h1>
      <p class="fs-4">Comida Tradicional Colombiana</p>
      <button class="btn btn-warning btn-lg mt-3 fw-semibold">Ver catálogo</button>
    </div>
  </div>
  <div>
<!-- Abaajo del Banner / Carrusel de Productos -->
<div id="carouselProductos" class="carousel slide mb-4" data-bs-ride="carousel">
  
  <!-- Encabezado con Título y Botones de Control -->
  <div class="info-prev mb-4 d-flex justify-content-between align-items-center">
    <div>
      <h4 class="fw-bold mb-1">Nuestros Productos</h4>
      <p class="text-muted mb-0">Explora lo mejor de nuestra gastronomía</p>
    </div>
    
    <!-- Controles del Carrusel -->
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center" 
              type="button" data-bs-target="#carouselProductos" data-bs-slide="prev" style="width: 36px; height: 36px;">
        <span class="carousel-control-prev-icon d-inline-block" style="width: 1rem; height: 1rem;" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center" 
              type="button" data-bs-target="#carouselProductos" data-bs-slide="next" style="width: 36px; height: 36px;">
        <span class="carousel-control-next-icon d-inline-block" style="width: 1rem; height: 1rem;" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </div>

  <!-- Diapositivas del Carrusel -->
  <div class="carousel-inner">
    <!-- DIAPOSITIVA 1 (Tus 3 imágenes en fila) -->
    <div class="carousel-item active">
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <img src="https://i.pinimg.com/1200x/7c/d2/1a/7cd21a7cf9b8e4e8664459e4ea5501f2.jpg"
            class="img-fluid rounded-4 object-fit-cover w-100" style="height: 250px;" alt="Comida Tradicional">
        </div>
        <div class="col-12 col-md-4">
          <img src="https://i.pinimg.com/736x/12/fe/02/12fe024ef49506d1e2f571867372f036.jpg"
            class="img-fluid rounded-4 object-fit-cover w-100" style="height: 250px;" alt="Comida Tradicional">
        </div>
        <div class="col-12 col-md-4">
          <img src="https://i.pinimg.com/736x/f6/c7/f5/f6c7f5e4e897ce2d7b114977f945e8fa.jpg"
            class="img-fluid rounded-4 object-fit-cover w-100" style="height: 250px;" alt="Comida Tradicional">
        </div>
      </div>
    </div>

    <!-- DIAPOSITIVA 2 (Agrega aquí más imágenes si lo deseas) -->
    <div class="carousel-item">
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <img src="https://i.pinimg.com/736x/f6/c7/f5/f6c7f5e4e897ce2d7b114977f945e8fa.jpg"
            class="img-fluid rounded-4 object-fit-cover w-100" style="height: 250px;" alt="Comida Tradicional">
        </div>
        <div class="col-12 col-md-4">
          <img src="https://i.pinimg.com/1200x/7c/d2/1a/7cd21a7cf9b8e4e8664459e4ea5501f2.jpg"
            class="img-fluid rounded-4 object-fit-cover w-100" style="height: 250px;" alt="Comida Tradicional">
        </div>
        <div class="col-12 col-md-4">
          <img src="https://i.pinimg.com/736x/12/fe/02/12fe024ef49506d1e2f571867372f036.jpg"
            class="img-fluid rounded-4 object-fit-cover w-100" style="height: 250px;" alt="Comida Tradicional">
        </div>
      </div>
    </div>

  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../JS/app.js"></script>
</body>

</html>
